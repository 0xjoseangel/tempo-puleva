<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tempo · Prototipo de shot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Outfit:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
  <style>
    .preview { display: grid; grid-template-rows: auto 1fr auto; min-height: 100svh; }
    .preview header, .preview footer { padding: 1.25rem var(--gutter); display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
    .preview h1 { font-size: var(--fs-h3); }
    .stage { position: relative; min-height: 60svh; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
    .picker { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .hint { margin: 0; color: var(--c-night-soft); font-size: var(--fs-small); }
  </style>
</head>
<body>
  <main class="preview">
    <header>
      <h1>Tempo <span class="wordmark">by Puleva</span> — prototipo de envase</h1>
      <div class="picker" role="group" aria-label="Elegir gama"></div>
    </header>
    <div class="stage" id="stage" role="img" aria-label="Envase 3D de Tempo"></div>
    <footer>
      <p class="hint">Arrastra para girar · pasa el ratón para elevar · clic para ver la ficha<br />En Tempo Activo, clic en el tapón para liberar la creatina</p>
      <div class="picker">
        <button class="btn" id="activate" hidden>Pulsar tapón</button>
        <button class="btn" id="open-sheet">Ver ficha</button>
      </div>
    </footer>
  </main>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
